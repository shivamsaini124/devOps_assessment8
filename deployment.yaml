apiVersion: apps/v1
kind: Deployment

metadata:
  name: shivam-profile

spec:
  replicas: 2

  selector:
    matchLabels:
      app: shivam-profile

  template:
    metadata:
      labels:
        app: shivam-profile

    spec:
      containers:
        - name: shivam-profile
          image: shivam3294/shivam-profile:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 80

---

apiVersion: v1
kind: Service

metadata:
  name: shivam-profile-service

spec:
  type: NodePort

  selector:
    app: shivam-profile

  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080